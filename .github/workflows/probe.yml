name: CI Probe
on:
  push:
    branches: [ '**' ]
    paths: [ '.github/workflows/probe.yml' ]
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Environment probe
        run: |
          echo "OK probe"
          java -version 2>&1 || true
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls "$ANDROID_SDK_ROOT" 2>/dev/null | head
