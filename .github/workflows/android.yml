name: Android CI / Release APK

on:
  push:
    branches: [ '**' ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0 platform-tools'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Restore signing keystore
        env:
          KS_B64: ${{ secrets.DLSS_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.DLSS_KEYSTORE_PASSWORD }}
        run: |
          mkdir -p keystore
          if [ -n "$KS_B64" ]; then
            echo "using repository signing keystore"
            printf '%s' "$KS_B64" | base64 -d > keystore/dlss5-release.jks
            echo "DLSS_STORE_PASSWORD=$KS_PASS" >> "$GITHUB_ENV"
            echo "DLSS_KEY_PASSWORD=$KS_PASS"    >> "$GITHUB_ENV"
            echo "DLSS_KEY_ALIAS=dlss5"          >> "$GITHUB_ENV"
            echo "STABLE_SIGNING=true"           >> "$GITHUB_ENV"
          else
            echo "::warning::DLSS_KEYSTORE_B64 secret not set — generating an ephemeral key (updates will need a reinstall)"
            keytool -genkeypair -v \
              -keystore keystore/dlss5-release.jks \
              -alias dlss5 \
              -keyalg RSA -keysize 2048 -validity 10950 \
              -storepass dlss5release -keypass dlss5release \
              -dname "CN=DLSS-5, OU=Mobile, O=DLSS-5, L=Karachi, S=Sindh, C=PK"
            echo "STABLE_SIGNING=false" >> "$GITHUB_ENV"
          fi

      - name: Bootstrap persistent signing key (first run only)
        if: env.STABLE_SIGNING == 'false' && github.event_name == 'push' && github.ref == 'refs/heads/arena/05dd539f-dlss-5'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          PASS=$(openssl rand -base64 24 | tr -d '/+=' | cut -c1-32)
          keytool -genkeypair -v \
            -keystore keystore/dlss5-release.jks \
            -alias dlss5 -keyalg RSA -keysize 2048 -validity 10950 \
            -storepass "$PASS" -keypass "$PASS" \
            -dname "CN=DLSS-5, OU=Mobile, O=DLSS-5, L=Karachi, S=Sindh, C=PK"
          B64=$(base64 -w0 keystore/dlss5-release.jks)
          api="https://api.github.com/repos/${{ github.repository }}/actions/secrets"
          enc() { openssl pkeyutl -encrypt -pubin -inkey pk.pem -in "$1" | openssl base64 | tr -d '\n'; }
          curl -sS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "$api/public-key" -o pk.json
          python3 -c "import json;d=json.load(open('pk.json'));open('pk.pem','w').write(d['key']);open('kid.txt','w').write(d['key_id'])"
          KID=$(cat kid.txt)
          printf '%s' "$B64" > store.b64
          printf '%s' "$PASS" > store.pass
          put() {
            BODY=$(python3 - "$1" "$2" "$3" <<'PY2'
import json,sys
enc=open(sys.argv[1]).read().strip()
print(json.dumps({"encrypted_value":enc,"key_id":sys.argv[3]}))
PY2
)
            curl -sS -X PUT -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              -H "Content-Type: application/json" -d "$BODY" "$api/$2"
            echo " -> secret $2 set"
          }
          put <(enc store.b64) DLSS_KEYSTORE_B64 "$KID"
          put <(enc store.pass) DLSS_KEYSTORE_PASSWORD "$KID"
          echo "secrets installed; the next run signs with the stable key"

      - name: Unit tests
        run: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace :app:testDebugUnitTest 2>&1 | tee build.log

      - name: Assemble release
        run: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace :app:assembleRelease 2>&1 | tee -a build.log

      - name: Collect artifacts
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/*.apk out/DLSS-5-${{ github.run_number }}.apk 2>/dev/null || true
          cp app/build/outputs/apk/debug/*.apk out/DLSS-5-debug-${{ github.run_number }}.apk 2>/dev/null || true
          ls -lh out

      - name: Verify APK
        run: |
          APK=$(ls out/DLSS-5-*.apk | head -1)
          {
            echo "=== APK: $APK ==="
            ls -l "$APK"
            echo "=== badging ==="
            "$ANDROID_SDK_ROOT/build-tools/34.0.0/aapt2" dump badging "$APK" | head -8
            echo "=== permissions ==="
            "$ANDROID_SDK_ROOT/build-tools/34.0.0/aapt2" dump permissions "$APK"
            echo "=== components ==="
            "$ANDROID_SDK_ROOT/build-tools/34.0.0/aapt2" dump xmltree --file AndroidManifest.xml "$APK" > manifest.xml 2>&1 || true
            grep -E 'E: (service|receiver|activity)' -A2 manifest.xml > components.txt || true
            sed -n '1,30p' components.txt
            echo "=== signature ==="
            "$ANDROID_SDK_ROOT/build-tools/34.0.0/apksigner" verify --verbose --print-certs "$APK" > signing.txt 2>&1 || true
            sed -n '1,14p' signing.txt
            echo "=== END VERIFY ==="
          } 2>&1 | tee -a build.log || true

      - name: Publish build log to ci-logs branch
        if: always()
        run: |
          if [ ! -f build.log ]; then echo "no log produced" && exit 0; fi
          WORK=$(mktemp -d)
          cd "$WORK"
          git init -q
          git config user.name  "dlss5-ci"
          git config user.email "ci@dlss5.local"
          git checkout -q -b ci-logs
          cp "$GITHUB_WORKSPACE/build.log" build.log
          printf '%s\n' "# Run $GITHUB_RUN_ID · $GITHUB_SHA · $GITHUB_JOB" > run.txt
          git add build.log run.txt
          git commit -q -m "ci log for run $GITHUB_RUN_ID"
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-logs

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: dlss5-apk
          path: out/*.apk
          if-no-files-found: error

      - name: Commit APK into repository dist/
        if: github.event_name == 'push' && github.ref == 'refs/heads/arena/05dd539f-dlss-5'
        run: |
          set -e
          APK=$(ls out/DLSS-5-*.apk | head -1)
          mkdir -p dist
          cp "$APK" dist/DLSS-5.apk
          cat > dist/README.md <<'MD'
          # Direct APK download

          [`DLSS-5.apk`](./DLSS-5.apk) — latest signed release build, committed automatically by CI.

          Click the file above, then use **Download raw file** (or append `?raw=true` to the URL).
          Install on Android 8.0+ and grant **Display over other apps**.
          MD
          git config user.name "dlss5-ci"
          git config user.email "ci@dlss5.local"
          git add dist/DLSS-5.apk dist/README.md
          if git diff --cached --quiet; then
            echo "APK unchanged"
          else
            git commit -m "build(apk): publish release APK [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          fi

      - name: Publish to GitHub Releases
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'build-latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'DLSS-5 latest build' }}
          body: |
            **DLSS-5** automatic build from `${{ github.ref_name }}` @ `${{ github.sha }}`.

            Download `DLSS-5-*.apk` below, then install it on your Android 8.0+ phone
            (allow "Install unknown apps" for your browser/file manager).

            Build log: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          files: out/*.apk
          fail_on_unmatched_files: true
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/v') }}
