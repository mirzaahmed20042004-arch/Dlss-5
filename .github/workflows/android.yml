name: Android CI / Release APK

on:
  push:
    branches: [ '**' ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to publish the APK to (e.g. v1.1.0)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0 platform-tools'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Restore signing keystore
        env:
          KS_B64: ${{ secrets.DLSS_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.DLSS_KEYSTORE_PASSWORD }}
        run: |
          mkdir -p keystore
          KS=keystore/dlss5-release.jks
          if [ -n "$KS_B64" ]; then
            echo "using repository signing keystore (stable upgrades)"
            printf '%s' "$KS_B64" | base64 -d > "$KS"
            echo "DLSS_STORE_PASSWORD=$KS_PASS" >> "$GITHUB_ENV"
            echo "DLSS_KEY_PASSWORD=$KS_PASS"   >> "$GITHUB_ENV"
          else
            # Deterministic fallback so consecutive CI runs still share one identity, letting users
            # update in place instead of uninstalling. Not a secret: this key only proves nobody
            # tampered with the download, and the source is public.
            echo "::warning::DLSS_KEYSTORE_B64 secret not set - using the repository's public CI key"
            keytool -genkeypair -v \
              -keystore "$KS" -storetype PKCS12 \
              -alias dlss5 -keyalg RSA -keysize 2048 -validity 10950 \
              -storepass dlss5release -keypass dlss5release \
              -dname "CN=DLSS-5, OU=Mobile, O=DLSS-5, L=Karachi, S=Sindh, C=PK"
            echo "DLSS_STORE_PASSWORD=dlss5release" >> "$GITHUB_ENV"
            echo "DLSS_KEY_PASSWORD=dlss5release"   >> "$GITHUB_ENV"
          fi
          echo "DLSS_KEY_ALIAS=dlss5" >> "$GITHUB_ENV"
          echo "DLSS_KEYSTORE_PATH=$GITHUB_WORKSPACE/$KS" >> "$GITHUB_ENV"

      - name: Unit tests
        run: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace :app:testDebugUnitTest 2>&1 | tee build.log

      - name: Assemble release
        run: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace :app:assembleRelease 2>&1 | tee -a build.log

      - name: Collect artifacts
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/*.apk out/DLSS-5-${{ github.run_number }}.apk 2>/dev/null || true
          cp app/build/outputs/apk/debug/*.apk out/DLSS-5-debug-${{ github.run_number }}.apk 2>/dev/null || true
          ls -lh out

      - name: Verify APK
        run: |
          APK=$(ls out/DLSS-5-*.apk | head -1)
          {
            echo "=== APK: $APK ==="
            ls -l "$APK"
            echo "=== badging ==="
            "$ANDROID_SDK_ROOT/build-tools/34.0.0/aapt2" dump badging "$APK" | head -8
            echo "=== permissions ==="
            "$ANDROID_SDK_ROOT/build-tools/34.0.0/aapt2" dump permissions "$APK"
            echo "=== components ==="
            "$ANDROID_SDK_ROOT/build-tools/34.0.0/aapt2" dump xmltree --file AndroidManifest.xml "$APK" > manifest.xml 2>&1 || true
            grep -E 'E: (service|receiver|activity)' -A2 manifest.xml > components.txt || true
            sed -n '1,30p' components.txt
            echo "=== signature ==="
            "$ANDROID_SDK_ROOT/build-tools/34.0.0/apksigner" verify --verbose --print-certs "$APK" > signing.txt 2>&1 || true
            sed -n '1,14p' signing.txt
            echo "=== END VERIFY ==="
          } 2>&1 | tee -a build.log || true

      - name: Publish build log to ci-logs branch
        if: always()
        run: |
          if [ ! -f build.log ]; then echo "no log produced" && exit 0; fi
          WORK=$(mktemp -d)
          cd "$WORK"
          git init -q
          git config user.name  "dlss5-ci"
          git config user.email "ci@dlss5.local"
          git checkout -q -b ci-logs
          cp "$GITHUB_WORKSPACE/build.log" build.log
          printf '%s\n' "# Run $GITHUB_RUN_ID · $GITHUB_SHA · $GITHUB_JOB" > run.txt
          git add build.log run.txt
          git commit -q -m "ci log for run $GITHUB_RUN_ID"
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-logs

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: dlss5-apk
          path: out/*.apk
          if-no-files-found: error

      - name: Commit APK into repository dist/
        if: github.event_name == 'push' && github.ref == 'refs/heads/arena/05dd539f-dlss-5'
        run: |
          set -e
          APK=$(ls out/DLSS-5-*.apk | head -1)
          mkdir -p dist
          cp "$APK" dist/DLSS-5.apk
          cat > dist/README.md <<'MD'
          # Direct APK download

          [`DLSS-5.apk`](./DLSS-5.apk) — latest signed release build, committed automatically by CI.

          Click the file above, then use **Download raw file** (or append `?raw=true` to the URL).
          Install on Android 8.0+ and grant **Display over other apps**.
          MD
          git config user.name "dlss5-ci"
          git config user.email "ci@dlss5.local"
          git add dist/DLSS-5.apk dist/README.md
          if git diff --cached --quiet; then
            echo "APK unchanged"
          else
            git commit -m "build(apk): publish release APK [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          fi

      - name: Publish to GitHub Releases
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag != '' && github.event.inputs.release_tag || (startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'build-latest') }}
          name: ${{ github.event.inputs.release_tag != '' && format('DLSS-5 {0}', github.event.inputs.release_tag) || (startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'DLSS-5 latest build') }}
          body: |
            **DLSS-5** automatic build from `${{ github.ref_name }}` @ `${{ github.sha }}`.

            Download `DLSS-5-*.apk` below, then install it on your Android 8.0+ phone
            (allow "Install unknown apps" for your browser/file manager).

            Build log: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          files: out/*.apk
          fail_on_unmatched_files: true
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/v') }}
